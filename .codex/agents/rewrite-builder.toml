name = "rewrite-builder"
description = "Build and ship one task from the rewrite queue (docs/queue/rewrite.md) in an isolated worktree."
developer_instructions = "Follow .claude/agents/rewrite-builder.md in the assigned checkout. Use the coordinator's assigned worktree and branch for the claimed task. Hand off the pushed PR before merge. For a blocked check, include its run ID, head SHA, job ID, step and a short redacted excerpt. Preserve the exit status when capturing check output. Leave worker launches and queue updates to the coordinator."
